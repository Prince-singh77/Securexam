<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureExam | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-brand">
            <div class="brand-logo">S</div>

            <h1>SecureExam</h1>

            <p>
                Secure examinations. Smarter classrooms.
            </p>
        </div>


        <div class="login-card">

            <div class="login-heading">

                <span class="eyebrow">
                    SECURE ACCESS
                </span>

                <h2>Welcome back</h2>

                <p>
                    Sign in to continue to your dashboard.
                </p>

            </div>


                       <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >


            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >


            <label>Continue as</label>

            <select id="role">

                <option value="teacher">
                    Teacher
                </option>

                <option value="student">
                    Student
                </option>

               

            </select>


            <button
                class="primary-btn"
                onclick="login()"
            >
                Sign in →
            </button>


            <p id="message" class="login-message"></p>
                          <p style="text-align:center; margin-top:14px;">
                  New here? <a href="register.html">Create an account</a>
              </p>


            <div class="security-note">

                <span>🛡️</span>

                <span>
                    Your examination environment is protected.
                </span>

            </div>

        </div>


        <p class="login-footer">
            SecureExam Prototype • 2026
        </p>

    </div>

    <script src="script.js"></script>

</body>

</html>
