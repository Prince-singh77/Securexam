<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureExam | Mark Attendance</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .scan-wrap {
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 24px; gap: 20px;
        }
        .scan-card {
            width: 100%; max-width: 420px; text-align: center; padding: 32px 24px;
            border-radius: 16px; border: 1px solid rgba(128, 128, 128, 0.35);
            background: rgba(128, 128, 128, 0.1);
        }
        .scan-icon { font-size: 52px; margin-bottom: 12px; }
        .scan-card h2 { margin: 0 0 8px; }
        .scan-card p { margin: 0 0 20px; opacity: 0.8; line-height: 1.5; }
        .scan-link {
            display: inline-block; padding: 10px 18px; border-radius: 10px;
            border: 1px solid rgba(128, 128, 128, 0.5); color: inherit; text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="scan-wrap">

        <div class="brand-logo">S</div>

        <div class="scan-card">

            <div class="scan-icon" id="scanIcon">⏳</div>

            <h2 id="scanTitle">Marking your attendance...</h2>

            <p id="scanText">Please wait a moment.</p>

            <a class="scan-link" href="classes.html">Go to My Classes</a>

        </div>

    </div>

    <script src="script.js"></script>
    <script src="scan.js"></script>

</body>

</html>
