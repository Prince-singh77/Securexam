<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureExam | My Exams</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="extra.css">
</head>

<body class="app-body">

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">

        <header class="topbar">

            <div>
                <span class="page-location">Workspace / My Exams</span>
                <h2>My Exams</h2>
            </div>

            <div class="topbar-actions">
                <div class="profile">
                    <div class="avatar" id="avatar">--</div>
                    <div>
                        <strong id="userName">Loading...</strong>
                        <span>Student</span>
                    </div>
                </div>
            </div>

        </header>

        <section class="dashboard-page stack">

            <p id="formMessage" class="form-message"></p>

            <div class="panel">

                <div class="panel-header">
                    <div>
                        <h3>Your exams</h3>
                        <p>Exams published for the classes you have joined</p>
                    </div>
                </div>

                <div id="examList"></div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>
    <script src="sidebar.js"></script>
    <script src="myexams.js"></script>

</body>

</html>
